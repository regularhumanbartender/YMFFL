# DO NOT MODIFY THIS FILE
env:
  NODE_DIST_URI:
    uri-role: node-dist-uri
  ARTIFACTS_API_URI:
    uri-role: foundry-artifacts-api
  API_GATEWAY_URI:
    uri-role: api-gateway

required-job-token-capabilities:
  - osdk-app

java-version: JAVA_11

jobs:
  osdk-app-publish:
    timeout: 20 minutes
    steps:
      - |
        set -euo pipefail
        if [[ -n "${DEFAULT_CA_PATH:-}" ]]; then
          export NODE_EXTRA_CA_CERTS="${NODE_EXTRA_CA_CERTS:-$DEFAULT_CA_PATH}"
          export SSL_CERT_FILE="${SSL_CERT_FILE:-$DEFAULT_CA_PATH}"
        fi

        if [[ -n "${JEMMA_TAG:-}" ]]; then
          export VERIFY_ENV_PRODUCTION=true
        fi

        if [[ -n "${JEMMA_FOUNDRY_BRANCH:-}" ]]; then
          export FOUNDRY_BRANCH_RID="${JEMMA_FOUNDRY_BRANCH}"
          echo "Configured FOUNDRY_BRANCH_RID to ${FOUNDRY_BRANCH_RID}"
        fi

        export NO_COLOR=1
        export FOUNDRY_TOKEN="${JOB_TOKEN}"
        . .jemma/settings.sh
        . .jemma/install-node.sh

        if [[ -n "${JEMMA_TAG:-}" ]]; then
          git tag --points-at HEAD | while IFS= read -r tag; do
            [[ "${tag}" == "${JEMMA_TAG}" ]] || git tag -d "${tag}" > /dev/null
          done
        fi

        npm_registry=${ARTIFACTS_API_URI}/repositories/${REPOSITORY_RID}/contents/release/npm/
        npm_registry_without_protocol=${npm_registry#https://}
        npm config set --location project registry=${npm_registry}
        npm config set --location project //${npm_registry_without_protocol}:_authToken=\${FOUNDRY_TOKEN}
        git update-index --assume-unchanged .npmrc

        npm install --prefer-offline --ignore-scripts
        npm run lint
        npm run test
        npm run build

        if [[ -z "${JEMMA_TAG:-}" && -z "${JEMMA_FOUNDRY_BRANCH:-}" && "${JEMMA_IS_PROTECTED_BRANCH:-false}" != "true" ]]; then
          chmod +x ./.jemma/sync-sdk-dependencies.sh
          if ./.jemma/sync-sdk-dependencies.sh; then
            echo "No dependency changes; continuing parent script."
          else
            child_status=$?

            case "$child_status" in
              "10")
                echo "Patches found, attempting to apply patches"
                exit 0
                ;;
              *)
                echo "Dependency sync failed with status ${child_status}." >&2
                exit "$child_status"
                ;;
            esac
          fi
        fi

        if [[ -n "${STEMMA_PULL_REQUEST_RID:-}" && -z "${JEMMA_TAG:-}" ]]; then
          snapshot_id="foundry.v1@${REPOSITORY_RID}@${STEMMA_PULL_REQUEST_RID}@$(git rev-parse HEAD)"
          echo "Uploading snapshot version for PR preview with id: ${snapshot_id}"
          npx @osdk/cli@0.115.0 site deploy \
            --foundryUrl "${API_GATEWAY_URI%/api}" \
            --uploadOnly false \
            --snapshot \
            --snapshotId $snapshot_id
          exit 0
        fi

        if [[ -z "${JEMMA_TAG:-}" ]]; then
          echo "No jemma tag found skipping deploying website to artifacts"
          exit 0
        fi

        if [[ -n "${JEMMA_FOUNDRY_BRANCH:-}" ]]; then
          echo "Tag found, but this build targets a Foundry global branch; skipping website deployment to artifacts."
          exit 0
        fi

        npx @osdk/cli@0.115.0 site deploy --foundryUrl "${API_GATEWAY_URI%/api}"
